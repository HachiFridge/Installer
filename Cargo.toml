[package]
name = "fridgerator_installer"
version = "1.0.0"
edition = "2021"

[profile.release]
lto = true

[dependencies]
tinyjson = "2.5.1"
pelite = "0.10.0"
include-bytes-zstd = { version = "0.1.0", optional = true }
windows-registry = "0.6.1"
windows-result = "0.2"
steamlocate = "2.0.1"
bsdiff = "0.2.1"
reqwest = { version = "0.12.28", features = [
    "blocking",
    "json",
], optional = true }
bytes = { version = "1.11.1", optional = true }
once_cell = "1.21.3"
rust-i18n = "2.3.1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_UI",
    "Win32_Globalization",
]

[build-dependencies]
embed-resource = "2.4.2"
pelite = "0.10.0"
cc = "1.2.56"

[patch.crates-io]
embed-resource = { git = "https://github.com/nabijaczleweli/rust-embed-resource.git", rev = "e98e9aa28d66b0c2ff43516b41847cac372310dd" }

[features]
compress_bin = ["dep:include-bytes-zstd"]
net_install = ["dep:reqwest", "dep:bytes"]
